<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="How it works, in six layers from left to right: 1 Bronze, the 5 input files land as text with their file and row, and refused rows go to bronze.quarantine; 2 Silver, types and keys set, one row per Bronze row; 3 Gold, the cash rules: instalments, cash date, received, still due, late and never paid; 4 Semantic, the star schema of one fact per instalment and three dimensions; 5 Analytical, totals by payment method, region and month; 6 Reporting, the notebook and the Power BI pages Daily cash and Due and late.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 13.5px; fill: #475569; }
    .layer { font-size: 13px; font-weight: 700; fill: #0B1220; }
    .bold { font-size: 13px; font-weight: 700; fill: #0E1630; }
    .body { font-size: 12px; fill: #334155; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.3; }
  </style>
  <rect x="1" y="1" width="998" height="298" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="40" y="50" class="title">How it works</text>
  <text x="40" y="74" class="sub">One command, python load.py, builds each layer in order and checks the money to the cent.</text>
  <rect x="24" y="104" width="141" height="164" rx="14" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="48" cy="130" r="14" fill="#3B82F6"/><text x="48" y="135" class="layer" text-anchor="middle">1</text><text x="70" y="135" class="bold">Bronze</text>
  <text x="38" y="170" class="body">5 input files land</text>
  <text x="38" y="189" class="body">as text, with file and</text>
  <text x="38" y="208" class="body">row; refused rows to</text>
  <text x="38" y="227" class="body">bronze.quarantine</text>
  <line x1="166" y1="186" x2="181" y2="186" class="edge" marker-end="url(#arrow)"/>
  <rect x="183" y="104" width="141" height="164" rx="14" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="207" cy="130" r="14" fill="#0EA5E9"/><text x="207" y="135" class="layer" text-anchor="middle">2</text><text x="229" y="135" class="bold">Silver</text>
  <text x="197" y="170" class="body">Types and keys set,</text>
  <text x="197" y="189" class="body">one row per Bronze</text>
  <text x="197" y="208" class="body">row, counts checked</text>
  <line x1="325" y1="186" x2="340" y2="186" class="edge" marker-end="url(#arrow)"/>
  <rect x="342" y="104" width="141" height="164" rx="14" fill="#F8FAFC" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="366" cy="130" r="14" fill="#F59E0B"/><text x="366" y="135" class="layer" text-anchor="middle">3</text><text x="388" y="135" class="bold">Gold</text>
  <text x="356" y="170" class="body">The cash rules, once:</text>
  <text x="356" y="189" class="body">instalments, cash</text>
  <text x="356" y="208" class="body">date, received, due,</text>
  <text x="356" y="227" class="body">late, never paid</text>
  <line x1="484" y1="186" x2="499" y2="186" class="edge" marker-end="url(#arrow)"/>
  <rect x="501" y="104" width="141" height="164" rx="14" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.5"/>
  <circle cx="525" cy="130" r="14" fill="#14B8A6"/><text x="525" y="135" class="layer" text-anchor="middle">4</text><text x="547" y="135" class="bold">Semantic</text>
  <text x="515" y="170" class="body">The star schema: one</text>
  <text x="515" y="189" class="body">fact per instalment,</text>
  <text x="515" y="208" class="body">three dimensions</text>
  <line x1="643" y1="186" x2="658" y2="186" class="edge" marker-end="url(#arrow)"/>
  <rect x="660" y="104" width="141" height="164" rx="14" fill="#F8FAFC" stroke="#A855F7" stroke-width="1.5"/>
  <circle cx="684" cy="130" r="14" fill="#A855F7"/><text x="684" y="135" class="layer" text-anchor="middle">5</text><text x="706" y="135" class="bold">Analytical</text>
  <text x="674" y="170" class="body">Totals by payment</text>
  <text x="674" y="189" class="body">method, by region</text>
  <text x="674" y="208" class="body">and by month</text>
  <line x1="802" y1="186" x2="817" y2="186" class="edge" marker-end="url(#arrow)"/>
  <rect x="819" y="104" width="141" height="164" rx="14" fill="#F8FAFC" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="843" cy="130" r="14" fill="#22C55E"/><text x="843" y="135" class="layer" text-anchor="middle">6</text><text x="865" y="135" class="bold">Reporting</text>
  <text x="833" y="170" class="body">Notebook and Power</text>
  <text x="833" y="189" class="body">BI: daily cash, due</text>
  <text x="833" y="208" class="body">and late</text>
</svg>
