  <rect x="852" y="276" width="128" height="64" rx="7" fill="#F8FAFC" stroke="#22C55E" stroke-width="1.3"/><text x="862" y="294" class="name">notebook</text><text x="862" y="310" class="count">every README number</text>
  <rect x="852" y="440" width="128" height="90" rx="10" fill="#F8FAFC" stroke="#22C55E" stroke-width="1.3"/><text x="862" y="458" class="name" font-weight="700">Power BI</text>
  <rect x="860" y="468" width="112" height="22" rx="11" fill="#DCFCE7"/><text x="916" y="483" class="count" style="fill:#14532D" text-anchor="middle">Daily cash</text>
  <rect x="860" y="497" width="112" height="22" rx="11" fill="#DCFCE7"/><text x="916" y="512" class="count" style="fill:#14532D" text-anchor="middle">Due and late</text>

  <text x="20" y="556" class="where">data/input: 5 CSV files, 3 shop exports (orders, payments, customers) and the 2 mapping files (payment_methods.csv, regions.csv).</text>
  <text x="20" y="574" class="where">load.py check: fact_instalment holds all 103,886 payments of bronze.order_payments, and received + due + never paid = BRL 16,008,872.12.</text>
