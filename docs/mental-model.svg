<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Where the money goes: 103,886 payments worth BRL 16.0 million split by payment method (credit card BRL 12.5 million, boleto 2.87 million, voucher 379 thousand, debit card 218 thousand) and flow into received (BRL 14.4 million, 90.0%), still due on card instalments (BRL 1.56 million, 9.7%) and never paid (BRL 37 thousand, 0.2%) on the report date, 3 Sep 2018. 2,301 payments were confirmed late, 78% of them boleto.">
