<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="How it works: 01 Load, orders, payments and customers into PostgreSQL as they are; 02 Rules, cash in, still due, late and never paid defined once in SQL; 03 Model, a star schema with one instalment fact and date, payment method and state dimensions; 04 Report, a Power BI daily cash page and a due and late page.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#0E1630"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .num { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .step { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .desc { font-size: 13px; fill: #94A3B8; }
    .file { font-size: 12px; fill: #60A5FA; font-family: Consolas, "Cascadia Code", monospace; }
    .box { fill: #3B82F6; fill-opacity: 0.08; stroke: #3B82F6; stroke-opacity: 0.7; }
    .dot { fill: #3B82F6; fill-opacity: 0.35; }
    .link { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>

  <rect width="1000" height="290" rx="22" fill="url(#bg)"/>
  <text x="50" y="52" class="title">How it works</text>
  <text x="50" y="76" class="sub">One command loads and checks the warehouse; Power BI reads the finished star schema.</text>

  <path class="link" d="M255 175h30"/>
  <path class="link" d="M490 175h30"/>
  <path class="link" d="M725 175h30"/>

  <!-- 01 -->
  <rect x="50" y="105" width="205" height="150" rx="14" class="box"/>
  <circle cx="84" cy="140" r="18" class="dot"/>
  <text x="84" y="145" class="num" text-anchor="middle">01</text>
  <text x="112" y="146" class="step">Load</text>
  <text x="70" y="184" class="desc">Orders, payments by</text>
  <text x="70" y="203" class="desc">method and instalment,</text>
  <text x="70" y="222" class="desc">customers by state</text>
  <text x="70" y="243" class="file">sql/1_load.sql</text>

  <!-- 02 -->
  <rect x="285" y="105" width="205" height="150" rx="14" class="box"/>
  <circle cx="319" cy="140" r="18" class="dot"/>
  <text x="319" y="145" class="num" text-anchor="middle">02</text>
  <text x="347" y="146" class="step">Rules</text>
  <text x="305" y="184" class="desc">Cash in, still due, late</text>
  <text x="305" y="203" class="desc">and never paid, defined</text>
  <text x="305" y="222" class="desc">once for every report</text>
  <text x="305" y="243" class="file">sql/2_rules.sql</text>

  <!-- 03 -->
  <rect x="520" y="105" width="205" height="150" rx="14" class="box"/>
  <circle cx="554" cy="140" r="18" class="dot"/>
  <text x="554" y="145" class="num" text-anchor="middle">03</text>
  <text x="582" y="146" class="step">Model</text>
  <text x="540" y="184" class="desc">A star schema with a</text>
  <text x="540" y="203" class="desc">date table, so every day,</text>
  <text x="540" y="222" class="desc">month and year adds up</text>
  <text x="540" y="243" class="file">sql/3_model.sql</text>

  <!-- 04 -->
  <rect x="755" y="105" width="205" height="150" rx="14" class="box"/>
  <circle cx="789" cy="140" r="18" class="dot"/>
  <text x="789" y="145" class="num" text-anchor="middle">04</text>
  <text x="817" y="146" class="step">Report</text>
  <text x="775" y="184" class="desc">A daily cash page: what</text>
  <text x="775" y="203" class="desc">came in, what is due and</text>
  <text x="775" y="222" class="desc">what is late</text>
  <text x="775" y="243" class="file">powerbi/</text>
</svg>
