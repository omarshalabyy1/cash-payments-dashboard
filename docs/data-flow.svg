  <rect x="20" y="234" width="120" height="34" rx="7" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.3"/><text x="30" y="249" class="name">orders</text><text x="30" y="263" class="count">99,441 rows</text>
  <rect x="20" y="276" width="120" height="34" rx="7" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.3"/><text x="30" y="291" class="name">order_payments</text><text x="30" y="305" class="count">103,886 rows</text>
  <rect x="20" y="318" width="120" height="34" rx="7" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.3"/><text x="30" y="333" class="name">customers</text><text x="30" y="347" class="count">99,441 rows</text>
  <rect x="20" y="360" width="120" height="34" rx="7" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.3"/><text x="30" y="375" class="name">payment_methods</text><text x="30" y="389" class="count">5 rows</text>
  <rect x="20" y="402" width="120" height="34" rx="7" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.3"/><text x="30" y="417" class="name">regions</text><text x="30" y="431" class="count">27 rows</text>

  <rect x="174" y="234" width="120" height="34" rx="7" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1.3"/><text x="184" y="249" class="name">orders</text><text x="184" y="263" class="count">99,441 rows</text>
  <rect x="174" y="276" width="120" height="34" rx="7" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1.3"/><text x="184" y="291" class="name">order_payments</text><text x="184" y="305" class="count">103,886 rows</text>
  <rect x="174" y="318" width="120" height="34" rx="7" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1.3"/><text x="184" y="333" class="name">customers</text><text x="184" y="347" class="count">99,441 rows</text>
  <rect x="174" y="360" width="120" height="34" rx="7" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1.3"/><text x="184" y="375" class="name">payment_methods</text><text x="184" y="389" class="count">5 rows</text>
  <rect x="174" y="402" width="120" height="34" rx="7" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1.3"/><text x="184" y="417" class="name">regions</text><text x="184" y="431" class="count">27 rows</text>

  <rect x="328" y="192" width="136" height="34" rx="7" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3"/><text x="338" y="207" class="name">late_after_days: 3</text><text x="338" y="221" class="count">config/client.yaml</text>
  <rect x="328" y="276" width="136" height="34" rx="7" fill="#F8FAFC" stroke="#F59E0B" stroke-width="1.3"/><text x="338" y="291" class="name">instalment</text><text x="338" y="305" class="count">296,425 rows</text>

  <rect x="498" y="150" width="140" height="34" rx="7" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3"/><text x="508" y="165" class="name">calendar: 2016 to 2020</text><text x="508" y="179" class="count">config/client.yaml</text>
  <rect x="498" y="192" width="140" height="34" rx="7" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.3"/><text x="508" y="207" class="name">dim_date</text><text x="508" y="221" class="count">1,827 rows</text>
  <rect x="498" y="276" width="140" height="34" rx="7" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.3"/><text x="508" y="291" class="name">fact_instalment</text><text x="508" y="305" class="count">296,425 rows</text>
  <rect x="498" y="360" width="140" height="34" rx="7" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.3"/><text x="508" y="375" class="name">dim_payment_method</text><text x="508" y="389" class="count">5 rows</text>
  <rect x="498" y="402" width="140" height="34" rx="7" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.3"/><text x="508" y="417" class="name">dim_state</text><text x="508" y="431" class="count">27 rows</text>

  <rect x="672" y="192" width="146" height="34" rx="7" fill="#F8FAFC" stroke="#A855F7" stroke-width="1.3"/><text x="682" y="207" class="name">cash_by_month</text><text x="682" y="221" class="count">44 rows</text>
  <rect x="672" y="276" width="146" height="34" rx="7" fill="#F8FAFC" stroke="#A855F7" stroke-width="1.3"/><text x="682" y="291" class="name">cash_by_method</text><text x="682" y="305" class="count">5 rows</text>
  <rect x="672" y="360" width="146" height="34" rx="7" fill="#F8FAFC" stroke="#A855F7" stroke-width="1.3"/><text x="682" y="375" class="name">cash_in_by_region</text><text x="682" y="389" class="count">5 rows</text>

