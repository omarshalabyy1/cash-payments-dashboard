<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-label="Data flow, table by table, left to right through six layers: 5 input files load into 5 Bronze tables as text (orders 99,441, order_payments 103,886, customers 99,441, payment_methods 5, regions 27 rows; 0 refused to bronze.quarantine; ops.load_log records 5 rows per load). Silver types and keys the same rows. Gold turns every payment into one row per instalment, gold.instalment (296,425 rows), with late_after_days from config/client.yaml. Semantic builds fact_instalment (296,425) from Gold, dim_date (1,827 days, 2016 to 2020) from the calendar setting, and dim_payment_method (5) and dim_state (27) from Silver. Analytical has cash_by_month (44 months), cash_by_method and cash_in_by_region. Reporting: the notebook reads Semantic and Analytical, Power BI imports the four Semantic tables into two pages.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 13.5px; fill: #475569; }
    .layer { font-size: 13px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 11.5px; fill: #506078; }
    .name { font-size: 12.5px; fill: #0E1630; }
    .count { font-size: 11px; fill: #506078; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.3; }
  </style>
  <rect x="1" y="1" width="998" height="588" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="40" y="50" class="title">Data flow, table by table</text>
  <text x="40" y="74" class="sub">Every table, the tables it is built from and its rows after one run. load.py fills Bronze, then runs one SQL file per layer.</text>

  <rect x="20" y="96" width="120" height="26" rx="13" fill="#3B82F6"/><text x="80" y="114" class="layer" text-anchor="middle">1  Bronze</text>
  <text x="80" y="136" class="where" text-anchor="middle">schema bronze, text</text>
  <rect x="174" y="96" width="120" height="26" rx="13" fill="#0EA5E9"/><text x="234" y="114" class="layer" text-anchor="middle">2  Silver</text>
  <text x="234" y="136" class="where" text-anchor="middle">schema silver, tables</text>
  <rect x="328" y="96" width="136" height="26" rx="13" fill="#F59E0B"/><text x="396" y="114" class="layer" text-anchor="middle">3  Gold</text>
  <text x="396" y="136" class="where" text-anchor="middle">schema gold, table</text>
  <rect x="498" y="96" width="140" height="26" rx="13" fill="#14B8A6"/><text x="568" y="114" class="layer" text-anchor="middle">4  Semantic</text>
