<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Know where the money is, every day.">
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .wave { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -120; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>

  <rect x="1" y="1" width="998" height="148" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <path class="wave" stroke="#14B8A6" stroke-opacity="0.6" d="M30 95 C 160 40, 300 120, 430 70 M570 70 C 700 120, 840 40, 970 75"/>
  <path class="wave" stroke="#A855F7" stroke-opacity="0.45" style="animation-duration:9s" d="M30 112 C 200 80, 330 130, 440 95 M560 95 C 680 130, 820 80, 970 100"/>
  <circle cx="175" cy="70" r="4" fill="#94A3B8"/>
  <circle cx="365" cy="88" r="4" fill="#94A3B8"/>
  <circle cx="660" cy="92" r="4" fill="#94A3B8"/>
  <circle cx="860" cy="66" r="4" fill="#94A3B8"/>
  <circle cx="500" cy="62" r="22" fill="none" stroke="#14B8A6" stroke-opacity="0.6" stroke-width="1.6"/>
  <circle cx="500" cy="62" r="7" fill="#22C55E" class="pulse"/>

  <text x="500" y="130" font-size="14" fill="#475569" text-anchor="middle">Know where the money is, every day.</text>
</svg>
