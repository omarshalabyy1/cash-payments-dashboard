<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Daily cash and payments dashboard. 103,886 payments: 76% of the cash in arrived by credit card, and BRL 1.56 million was still due on instalments. Bars show cash by month, received and then still due.">
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 13px; font-weight: 600; fill: #2563EB; letter-spacing: 1.5px; }
    .title { font-size: 30px; font-weight: 700; fill: #0E1630; }
    .result { font-size: 15px; fill: #475569; }
    .chip { font-size: 13px; font-weight: 600; fill: #0E1630; }
    .cap { font-size: 11.5px; fill: #506078; }
    .in { fill: #94A3B8; }
    .due { fill: #3B82F6; }
      .wave { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -120; } }
  </style>

  <rect x="1" y="1" width="998" height="238" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <path class="wave" stroke="#14B8A6" stroke-opacity="0.5" d="M24 229 C 200 224, 330 233, 500 229 S 800 225, 976 229"/>
  <path class="wave" stroke="#A855F7" stroke-opacity="0.4" style="animation-duration:9s" d="M40 235 C 220 231, 360 238, 520 235 S 820 232, 960 235"/>

  <text x="50" y="62" class="eyebrow">PROJECT · DAILY CASH DASHBOARD</text>
